name: sailbandwidth checkin

# Triggers: manual / PR / push
on:
  workflow_dispatch:                                       # manual trigger (web/API)
  pull_request:
    branches: [btv_comm_2v2_release, 'feature/add_ci_workflow']   # release branch; keep CI branch during bring-up
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [btv_comm_2v2_release, 'feature/add_ci_workflow']   # run again after merge

permissions:
  contents: read
  packages: write
  pull-requests: write
  statuses: write

concurrency:
  group: ci-sailbandwidth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true                 # new runs cancel outdated ones

jobs:
  # Stage 1: Secret scan precheck (org-level reusable workflow).
  # Only meaningful for PR events; skipped for push / workflow_dispatch.
  precheck:
    name: Pre-check (Secret Scan)
    if: github.event_name == 'pull_request'
    uses: t-head/.github/.github/workflows/user-precheck.yml@main

  # Stage 2: AI code review.
  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    if: github.event_name == 'pull_request'
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  # Stage 3: Human approval gate before running the expensive PPU CI.
  human-review:
    name: Human Review Gate
    needs: [ai-code-review]
    if: github.event_name == 'pull_request'
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  # Stage 4: Build & test on PPU after all gates pass.
  build-test:
    name: Build & Test (${{ matrix.config.name }})
    needs: [precheck, human-review]
    if: always() && (needs.precheck.result == 'success' || needs.precheck.result == 'skipped') && (needs.human-review.result == 'success' || needs.human-review.result == 'skipped')
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: ubuntu24_hggcrt13
            image: download.t-head.cn/docker_release/ppu:sdk2.2.0-hggcrt3-ubuntu24.04-py312-20261005
            runner: ZW-M890P
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for potential base..head diff checks in future steps.
          fetch-depth: 0
          # sailbandwidth has no submodules, so no recursive checkout is needed.
      - name: Build and Test on PPU
        id: ppu-test
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ matrix.config.image }}
          nnodes: 0
          nproc_per_node: 2
          node_selector: "board-type=${{ matrix.config.runner }}"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            cd /workspace/source
            echo "######################### pwd has ##########################"
            ls
            set -e
            # Fix: image bakes in PIP_INDEX_URL pointing to unreachable internal server
            unset PIP_INDEX_URL 2>/dev/null || true
            # Fix: image bakes in git insteadOf redirecting github.com to unreachable internal gerrit
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            # git checks repo ownership strictly inside containers.
            git config --global --add safe.directory /workspace/source
            git config --global --add safe.directory '*'

            echo "######################### $(date +%Y%m%d%H%M%S) Install dependencies ##########################"
            if command -v apt-get >/dev/null 2>&1; then
              # PPU SDK images do not pre-install cmake/make; collect whatever is missing.
              MISSING_PKGS=""
              for pkg in libboost-program-options-dev cmake make; do
                if ! dpkg -s "$pkg" >/dev/null 2>&1; then
                  echo "$pkg is missing, will install"
                  MISSING_PKGS="$MISSING_PKGS $pkg"
                fi
              done
              if [ -z "$MISSING_PKGS" ]; then
                echo "build dependencies already installed"
              else
                # Some images ship with an internal-only T-head apt proxy that times
                # out in the GitHub runner network. Detect and replace it with a
                # public mirror; otherwise fall back to the usual Ubuntu mirror rewrite.
                if grep -Rq "art.eng.t-head.cn" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null; then
                  echo "Replacing art.eng.t-head.cn apt sources with mirrors.aliyun.com"
                  UBUNTU_CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")
                  rm -f /etc/apt/sources.list.d/*.sources
                  printf '%s\n' \
                    "deb http://mirrors.aliyun.com/ubuntu/ ${UBUNTU_CODENAME} main restricted universe multiverse" \
                    "deb http://mirrors.aliyun.com/ubuntu/ ${UBUNTU_CODENAME}-updates main restricted universe multiverse" \
                    "deb http://mirrors.aliyun.com/ubuntu/ ${UBUNTU_CODENAME}-backports main restricted universe multiverse" \
                    "deb http://mirrors.aliyun.com/ubuntu/ ${UBUNTU_CODENAME}-security main restricted universe multiverse" \
                    > /etc/apt/sources.list
                else
                  if [ -f /etc/apt/sources.list ]; then
                    sed -i 's|archive.ubuntu.com|mirrors.aliyun.com|g' /etc/apt/sources.list
                    sed -i 's|security.ubuntu.com|mirrors.aliyun.com|g' /etc/apt/sources.list
                  fi
                  for f in /etc/apt/sources.list.d/*.sources; do
                    [ -f "$f" ] || continue
                    sed -i 's|archive.ubuntu.com|mirrors.aliyun.com|g' "$f"
                    sed -i 's|security.ubuntu.com|mirrors.aliyun.com|g' "$f"
                  done
                fi
                apt-get update
                # shellcheck disable=SC2086 # intentional word splitting on package list
                apt-get install -y $MISSING_PKGS
              fi
            elif command -v yum >/dev/null 2>&1; then
              yum install -y boost-static cmake make
            fi

            echo "######################### $(date +%Y%m%d%H%M%S) Setup PPU SDK ##########################"
            source /usr/local/PPU_SDK/envsetup.sh || true
            which hgcc || true
            echo $PPU_SDK

            echo "######################### $(date +%Y%m%d%H%M%S) Build sailbandwidth ##########################"
            bash build.sh
            BUILD_EXIT_CODE=$?
            if [ $BUILD_EXIT_CODE -ne 0 ]; then
              echo "Build failed with exit code $BUILD_EXIT_CODE"
              exit 1
            fi

            echo "######################### $(date +%Y%m%d%H%M%S) Run sailbandwidth tests ##########################"
            python3 -m pip install junit-xml || true
            set +e
            python3 .github/workflows/scripts/pr-sailbandwidth-ut.py \
              --caselist .github/workflows/scripts/casecmd.list
            TEST_EXIT_CODE=$?
            # Record the runtime environment alongside the JUnit report.
            python3 <<'PYEOF' > env_info.json
            import json
            import os
            import shutil
            import subprocess
            import sys

            def command_output(command):
                executable = command[0]
                if not shutil.which(executable):
                    return "not found"
                result = subprocess.run(command, text=True, capture_output=True, check=False)
                return (result.stdout or result.stderr).strip()

            info = {
                "docker_image": "${{ matrix.config.image }}",
                "config_name": "${{ matrix.config.name }}",
                "python_version": sys.version,
                "ppu_sdk": os.environ.get("PPU_SDK", ""),
                "ppu_home": os.environ.get("PPU_HOME", ""),
                "hggcc_version": command_output(["hggcc", "--version"]),
                "hggcrt_version": command_output(["hggcrt", "--version"]),
            }
            print(json.dumps(info, indent=2, sort_keys=True))
            PYEOF
            # Copy the JUnit report and runtime information to NAS for the runner.
            NAS_RESULT_DIR="/mnt/wl_nas/devops/sailbandwidth-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.config.name }}"
            mkdir -p "$NAS_RESULT_DIR"
            cp test-results.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success

      - name: Test summary
        if: always()
        shell: bash
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/sailbandwidth-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.config.name }}"
          XML_FILE="$NAS_RESULT_DIR/test-results.xml"

          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 .github/workflows/scripts/display-test-summary.py "$XML_FILE"
